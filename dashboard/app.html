<style id="app-css">
/* Layout: departure-board header, next-trip hero, then the season's trips by month; a trip opens as its own view with a day-by-day itinerary. */
:root {

  --ok: #5ec98f; --ok-soft: #13301f; --warn: #f1b04e; --warn-soft: #3a2a10;
  --work: #ab9fff; --work-soft: #262046; --family: #52c6cf; --family-soft: #0f3034;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1319; --surface: #151d25; --ink: #e5ebf1; --muted: #93a0ad; --line: #26313c;
  --accent: #74a4ff; --accent-soft: #1a2944;
  --ok: #5ec98f; --ok-soft: #13301f; --warn: #f1b04e; --warn-soft: #3a2a10;
  --work: #ab9fff; --work-soft: #262046; --family: #52c6cf; --family-soft: #0f3034;
  color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 24px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; font-family: var(--body); }
a { color: var(--accent); }
.muted { color: var(--muted); }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

button { cursor: pointer; }

.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 500; white-space: nowrap; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 3px; gap: 2px; }

.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; min-width: 0; width: 240px; max-width: 100%; }

.board { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cols, .row { display: grid; grid-template-columns: 150px minmax(0, 1.5fr) minmax(0, 1.4fr) minmax(0, .9fr) 92px 112px 132px; gap: 14px; align-items: center; padding: 11px 18px; }
.cols { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.month { padding: 14px 18px 6px; font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); }
.month:first-of-type { border-top: 0; }
.row { text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.month + .row { border-top: 0; }
.row:hover { background: var(--bg); }
.row .d b { display: block; font-weight: 600; }
.row .where { font-weight: 600; min-width: 0; }
.row .where span { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; }
.row .stack { display: grid; gap: 3px; justify-items: start; }
.cost { font-size: 12.5px; color: var(--muted); }
.row.past { opacity: .62; }
.row.current { background: var(--ok-soft); }
.lbl { display: none; }
details.past-wrap summary { cursor: pointer; padding: 14px 18px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line); }

/* trip view */
.back { font-weight: 500; text-decoration: none; }
.trip-head { display: grid; gap: 10px; }
.trip-head .dest { font-size: 38px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }

.addline { display: flex; gap: 8px; }
.addline input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; }

.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--bg); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 20; }

.foot { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-side { border-left: 0; border-top: 1px dashed var(--line); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .cols { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; padding: 14px 16px; }
  .row .d, .row .where, .row .why { grid-column: 1 / -1; }
  .row .d b { display: inline; margin-right: 8px; }
  .row .d { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
  .lbl { display: inline; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  .search { width: 100%; }
}

    var dest = t.destinations[0], more = t.destinations.slice(1).join(" · ");
    return '<a class="row ' + (st === "past" ? "past" : st === "current" ? "current" : "") + '" href="#trip-' + esc(t.id) + '">' +
      '<div class="d"><b class="num">' + esc(fmtRange(t)) + '</b><span class="muted num">' + (n ? n + (n === 1 ? " night" : " nights") : "Day trip") + (st === "current" ? " · now" : "") + "</span></div>" +
      '<div class="where">' + esc(dest) + (more ? "<span>" + esc(more) + "</span>" : "") + "</div>" +
      '<div class="why">' + esc(t.purpose) + "</div>" +
      '<div class="stack"><span class="lbl">Travelers</span>' + kindChip(t) + '<span class="cost">' + esc(t.parties) + "</span></div>" +
      '<div class="stack"><span class="lbl">Car</span>' + fieldChip(t.car) + "</div>" +
      '<div class="stack"><span class="lbl">Flight</span>' + fieldChip(t.flight) + costTxt(t.flightCost) + "</div>" +
      '<div class="stack"><span class="lbl">Hotel</span>' + fieldChip(t.hotel) + costTxt(t.hotelCost) + "</div></a>";
  }

  function renderHome() {
    var trips = filtered();
    var all = DATA.trips.slice().sort(function (a, b) { return a.start.localeCompare(b.start); });
    var current = all.filter(function (t) { return tripStatus(t) === "current"; });
    var next = all.filter(function (t) { return tripStatus(t) === "upcoming"; })[0];
    var hero = current[0] || next;
    var h = '<header class="top"><div><div class="eyebrow">Goldman family</div><h1>Travel Board</h1><p class="muted">' +
      (DATA.updated ? "Updated " + esc(DATA.updated) + " from Evan’s travel doc, Gmail and work email" : "From Evan’s travel doc") + "</p></div>";
    if (current.length) h += '<div class="now"><span class="dot live"></span>Traveling now: ' + esc(current.map(function (t) { return t.destinations[0]; }).join(" + ")) + "</div>";
    else if (next) h += '<div class="now"><span class="dot"></span>Home · next trip ' + esc(MONTHS[pd(next.start).getMonth()] + " " + pd(next.start).getDate()) + "</div>";
    h += "</header>";

    if (hero) {
      var st = tripStatus(hero), d = days(today(), pd(hero.start)), res = resFor(hero);
      h += '<section class="hero" aria-label="' + (st === "current" ? "Current trip" : "Next trip") + '"><div class="hero-main">' +
        '<div class="eyebrow">' + (st === "current" ? "Happening now" : "Next trip") + "</div>" +
        '<div class="dest">' + esc(hero.destinations.join(" · ")) + "<small>" + esc(hero.purpose) + "</small></div>" +
        '<div class="count">' + (st === "current" ? "<b>Day " + (days(pd(hero.start), today()) + 1) + '</b><span class="muted">of ' + (nights(hero) + 1) + "</span>" : "<b>" + d + '</b><span class="muted">' + (d === 1 ? "day to go" : "days to go") + "</span>") + "</div>" +
        '<div class="facts"><div class="fact"><span class="eyebrow">Dates</span><span class="num">' + esc(fmtRange(hero)) + '</span></div><div class="fact"><span class="eyebrow">Who</span><span>' + esc(hero.parties) + '</span></div><div class="fact"><span class="eyebrow">Reservations</span><span class="num">' + res.length + "</span></div></div>" +
        '<div><a class="btn primary" href="#trip-' + esc(hero.id) + '">Open itinerary</a></div></div><div class="hero-side"><div class="eyebrow">First up</div>';
      if (res.length) {
        h += '<ul class="mini">' + res.slice(0, 5).map(function (r) {
          return "<li>" + icon(r.type) + '<div class="t"><div>' + esc(r.title) + '</div><div class="muted num" style="font-size:13px">' + esc((r.start ? fmtDay(r.start) + " " + fmtTime(r.start) : "")) + "</div></div>" + (r.confirmation ? '<span class="mono muted" style="font-size:12.5px">' + esc(r.confirmation) + "</span>" : "") + "</li>";
        }).join("") + "</ul>";
      } else h += '<p class="muted" style="margin:0">No reservations pulled from email yet for this trip.</p>';
      h += "</div></section>";
    }

    var attention = all.filter(function (t) { return tripStatus(t) !== "past" && openItems(t).length; });
    if (attention.length) {
      h += '<section class="attn"><h2>Needs attention</h2><ul class="alist">' + attention.map(function (t) {
        return '<li><a href="#trip-' + esc(t.id) + '"><b>' + esc(t.destinations[0]) + '</b> <span class="muted num">' + esc(MONTHS[pd(t.start).getMonth()] + " " + pd(t.start).getDate()) + '</span></a><ul>' + openItems(t).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></li>";
      }).join("") + "</ul></section>";
    }

    h += '<section class="bar"><h2>All trips</h2><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0">' +
      '<div class="seg" role="group" aria-label="Filter trips">' + [["all", "All"], ["work", "Work"], ["family", "Family"]].map(function (f) {
        return '<button type="button" data-filter="' + f[0] + '" aria-pressed="' + (state.filter === f[0]) + '">' + f[1] + "</button>";
      }).join("") + '</div><input id="q" class="search" type="search" placeholder="Search city, purpose, who" value="' + esc(state.q) + '" aria-label="Search trips">' +
      (state.canEdit ? '<button type="button" class="btn" data-act="new-trip">Add trip</button>' : "") + "</div></section>";

    var up = trips.filter(function (t) { return tripStatus(t) !== "past"; }), past = trips.filter(function (t) { return tripStatus(t) === "past"; });
    h += '<section class="board"><div class="cols"><div>Dates</div><div>Destination</div><div>Purpose</div><div>Traveling</div><div>Car</div><div>Flight</div><div>Hotel</div></div>';
    if (!up.length) h += '<div class="empty" style="margin:16px">No upcoming trips match.</div>';
    var lastM = "";
    up.forEach(function (t) {
      var d = pd(t.start), m = MONTHS_LONG[d.getMonth()] + " " + d.getFullYear();
      if (m !== lastM) { h += '<div class="month">' + m + "</div>"; lastM = m; }
      h += rowHtml(t);
    });
    if (past.length) h += '<details class="past-wrap"><summary>Past trips (' + past.length + ")</summary>" + past.reverse().map(rowHtml).join("") + "</details>";
    h += "</section>";
    h += footer();
    app.innerHTML = h;
  }

  function footer() {
    return '<p class="foot">Times are local to each place. Confirmation numbers come from the booking emails; tap a code to copy it.' + (state.canEdit ? " You can edit trips here; changes save for everyone with the link." : "") + "</p>" + saveBar();
  }
  function saveBar() {
    if (!state.dirty && !state.msg) return "";
    return '<div class="savebar" role="status">' + (state.msg ? "<span>" + esc(state.msg) + "</span>" : "<span>Unsaved changes</span>") +
      (state.dirty ? '<button type="button" class="btn small" data-act="save"' + (state.saving ? " disabled" : "") + ">" + (state.saving ? "Saving…" : "Save for everyone") + "</button>" : "") + "</div>";
  }

  function renderTrip(t) {
    var st = tripStatus(t), res = resFor(t), n = nights(t);
    var h = '<a class="back" href="#">← All trips</a><header class="trip-head"><div style="display:flex;gap:8px;flex-wrap:wrap">' + kindChip(t) +
      (st === "current" ? '<span class="chip ok">Happening now</span>' : st === "past" ? '<span class="chip">Past trip</span>' : '<span class="chip info num">In ' + days(today(), pd(t.start)) + " days</span>") + "</div>" +
      '<div class="dest">' + esc(t.destinations.join(" · ")) + "<small>" + esc(t.purpose) + "</small></div>" +
      '<div class="facts"><div class="fact"><span class="eyebrow">Dates</span><span class="num">' + esc(fmtRange(t)) + '</span></div><div class="fact"><span class="eyebrow">Length</span><span class="num">' + (n ? n + (n === 1 ? " night" : " nights") : "Day trip") + '</span></div><div class="fact"><span class="eyebrow">Traveling</span><span>' + esc(t.parties) + "</span></div></div></header>";

    if (state.editTrip) h += tripForm(t);
    else {
      h += '<section class="grid3">' +
        '<div class="tile"><span class="eyebrow">Car</span>' + fieldChip(t.car) + "</div>" +
        '<div class="tile"><span class="eyebrow">Flight</span><div>' + fieldChip(t.flight) + "</div>" + (costTxt(t.flightCost) || '<span class="cost">—</span>') + "</div>" +
        '<div class="tile"><span class="eyebrow">Hotel</span><div>' + fieldChip(t.hotel) + "</div>" + (costTxt(t.hotelCost) || '<span class="cost">—</span>') + "</div></section>";
    }

    h += '<div class="split"><section class="col"><div class="bar"><h2>Itinerary</h2>' + (state.canEdit && !state.addRes ? '<button type="button" class="btn small" data-act="add-res">Add reservation</button>' : "") + "</div>";
    if (state.addRes) h += resForm(t);
    if (!res.length) h += '<div class="empty">No reservations on file for this trip yet. When booking emails arrive, Claude adds the flights, hotels, cars and confirmations here.</div>';
    var byDay = {}, order = [];
    res.forEach(function (r) { var k = r.start ? r.start.slice(0, 10) : "zz"; if (!byDay[k]) { byDay[k] = []; order.push(k); } byDay[k].push(r); });
    order.forEach(function (k) {
      h += '<div class="day"><div class="eyebrow">' + (k === "zz" ? "Date not set" : esc(fmtDay(k))) + "</div>" + byDay[k].map(function (r) { return stub(r); }).join("") + "</div>";
    });
    h += '</section><aside class="col">';

    var auto = openItems(t), list = t.checklist || [];
    h += '<section class="panel"><h3>Checklist</h3><ul class="check">' +
      auto.map(function (a) { return '<li class="auto"><span aria-hidden="true">!</span><span>' + esc(a) + "</span><span></span></li>"; }).join("") +
      list.map(function (c, i) {
        return '<li><input type="checkbox" id="ck-' + i + '" data-ck="' + i + '"' + (c.done ? " checked" : "") + (state.canEdit ? "" : " disabled") + '><label for="ck-' + i + '" class="' + (c.done ? "done" : "") + '">' + esc(c.t) + "</label>" + (state.canEdit ? '<button type="button" class="linkbtn" data-ckdel="' + i + '" aria-label="Remove item">✕</button>' : "<span></span>") + "</li>";
      }).join("") + "</ul>" +
      (!auto.length && !list.length ? '<p class="muted" style="margin:0">Nothing open.</p>' : "") +
      (state.canEdit ? '<form class="addline" data-form="ck"><input id="ck-new" placeholder="Add an item, e.g. passports" aria-label="New checklist item"><button class="btn small" type="submit">Add</button></form>' : "") + "</section>";

    h += '<section class="panel"><h3>Notes</h3>' + (state.canEdit ? '<textarea id="notes" rows="4" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box" placeholder="Gate codes, who’s picking up, dinner plans…">' + esc(t.notes || "") + "</textarea>" : (t.notes ? '<p class="notes">' + esc(t.notes) + "</p>" : '<p class="muted" style="margin:0">No notes.</p>')) + "</section>";
    if (state.canEdit && !state.editTrip) h += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="edit-trip">Edit trip details</button></div>';
    h += "</aside></div>" + footer();
    app.innerHTML = h;
  }

  function stub(r) {
    var idx = DATA.reservations.indexOf(r);
    var meta = [];
    if (r.provider) meta.push("<span>" + esc(r.provider) + "</span>");
    if (r.travelers) meta.push('<span class="muted">' + esc(r.travelers) + "</span>");
    if (r.cost) meta.push('<span class="num">' + esc(r.cost) + "</span>");
    return '<article class="stub"><div class="ic" title="' + esc(TYPE_LABEL[r.type] || "Other") + '">' + icon(r.type) + '</div><div class="bd">' +
      '<div class="hd"><span class="ttl">' + esc(r.title) + "</span>" + (r.status === "changed" ? '<span class="chip warn">Schedule changed</span>' : "") + "</div>" +
      (fmtWhen(r) ? '<div class="when">' + esc(fmtWhen(r)) + "</div>" : "") +
      (r.confirmation ? '<div class="pnr"><span class="eyebrow">Conf.</span><code>' + esc(r.confirmation) + '</code><button type="button" class="copy" data-copy="' + esc(r.confirmation) + '">Copy</button></div>' : "") +
      (meta.length ? '<div class="meta">' + meta.join("") + "</div>" : "") +
      (r.location ? '<div class="det">' + esc(r.location) + "</div>" : "") +
      (r.details ? '<div class="det">' + esc(r.details) + "</div>" : "") +
      '<div class="meta" style="font-size:12.5px">' + (r.source ? '<span class="muted">From ' + esc(r.source) + "</span>" : "") +
      (r.email_link ? '<a href="' + esc(r.email_link) + '" target="_blank" rel="noopener">Open email</a>' : "") +
      (state.canEdit ? '<button type="button" class="linkbtn" data-resdel="' + idx + '" style="color:var(--warn)">Remove</button>' : "") + "</div></div></article>";
  }

  function inp(id, label, val, type, full) { return '<label' + (full ? ' class="full"' : "") + ' for="' + id + '">' + label + '<input id="' + id + '" type="' + (type || "text") + '" value="' + esc(val || "") + '"></label>'; }
  function tripForm(t) {
    return '<section class="panel"><h3>' + (t._new ? "New trip" : "Edit trip details") + '</h3><form class="f" data-form="trip">' +
      inp("tf-start", "Start date", t.start, "date") + inp("tf-end", "End date", t.end, "date") +
      '<label class="full" for="tf-dest">Destinations (one per line)<textarea id="tf-dest" rows="2">' + esc(t.destinations.join("\n")) + "</textarea></label>" +
      inp("tf-purpose", "Purpose", t.purpose, "text", true) +
      '<label for="tf-kind">Type<select id="tf-kind"><option value="work"' + (t.kind === "work" ? " selected" : "") + '>Work</option><option value="family"' + (t.kind !== "work" ? " selected" : "") + ">Family</option></select></label>" +
      inp("tf-parties", "Traveling parties", t.parties) + inp("tf-car", "Car booked", t.car) + '<span></span>' +
      inp("tf-flight", "Flight booked", t.flight) + inp("tf-flightCost", "Flight cost", t.flightCost) +
      inp("tf-hotel", "Hotel booked", t.hotel) + inp("tf-hotelCost", "Hotel cost", t.hotelCost) +
      '<div class="acts"><button class="btn primary" type="submit">Apply</button><button class="btn" type="button" data-act="cancel-trip">Cancel</button>' +
      (t._new ? "" : '<button class="btn danger" type="button" data-act="del-trip">Delete trip</button>') + "</div></form></section>";
  }
  function resForm(t) {
    var opts = Object.keys(TYPE_LABEL).map(function (k) { return '<option value="' + k + '">' + TYPE_LABEL[k] + "</option>"; }).join("");
    return '<section class="panel"><h3>Add reservation</h3><form class="f" data-form="res">' +
      '<label for="rf-type">Type<select id="rf-type">' + opts + "</select></label>" + inp("rf-provider", "Company", "") +
      inp("rf-title", "Title (e.g. UA 1480 EWR → MCO)", "", "text", true) + inp("rf-conf", "Confirmation #", "") + inp("rf-travelers", "Travelers", "") +
      inp("rf-start", "Starts", t.start + "T09:00", "datetime-local") + inp("rf-end", "Ends", "", "datetime-local") +
      inp("rf-location", "Address / airports", "", "text", true) + inp("rf-details", "Details (seats, room, phone)", "", "text", true) + inp("rf-cost", "Cost", "") + "<span></span>" +
      '<div class="acts"><button class="btn primary" type="submit">Add</button><button class="btn" type="button" data-act="cancel-res">Cancel</button></div></form></section>';
  }

  var draftTrip = null;
  function currentTrip() {
    var m = /^#trip-(.+)$/.exec(location.hash);
    if (!m) return null;
    if (draftTrip && draftTrip.id === m[1]) return draftTrip;
    return DATA.trips.filter(function (t) { return t.id === m[1]; })[0] || null;
  }
  function render() {
    var t = currentTrip();
    if (t) renderTrip(t); else renderHome();
  }
  function markDirty() { state.dirty = true; state.msg = ""; }
  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button, [data-filter]");
    if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; render(); return; }
    if (b.dataset.copy) {
      var code = b.dataset.copy;
      try { navigator.clipboard.writeText(code).then(function () { b.textContent = "Copied"; }, function () { selectCode(b); }); } catch (_) { selectCode(b); }
      return;
    }
    var t = currentTrip();
    if (b.dataset.ckdel != null && t) { t.checklist.splice(+b.dataset.ckdel, 1); markDirty(); render(); return; }
    if (b.dataset.resdel != null) {
      if (b.dataset.armed) { DATA.reservations.splice(+b.dataset.resdel, 1); markDirty(); render(); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to remove"; }
      return;
    }
    switch (b.dataset.act) {
      case "save": save(); break;
      case "edit-trip": state.editTrip = true; render(); break;
      case "cancel-trip": state.editTrip = false; if (draftTrip) { draftTrip = null; location.hash = ""; } render(); break;
      case "del-trip":
        if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; break; }
        DATA.trips = DATA.trips.filter(function (x) { return x !== t; });
        DATA.reservations = DATA.reservations.filter(function (r) { return r.trip_id !== t.id; });
        state.editTrip = false; markDirty(); location.hash = ""; render(); break;
      case "add-res": state.addRes = true; render(); break;
      case "cancel-res": state.addRes = false; render(); break;
      case "new-trip":
        var d = today(), iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        draftTrip = { id: "trip-" + Date.now().toString(36), _new: true, start: iso, end: iso, destinations: [""], purpose: "", kind: "work", parties: "EMG", car: "N/A", flight: "No", flightCost: "$____", hotel: "No", hotelCost: "$____", checklist: [] };
        state.editTrip = true; location.hash = "trip-" + draftTrip.id; break;
    }
  });
  function selectCode(b) { var c = b.parentNode.querySelector("code"); var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }

  app.addEventListener("change", function (e) {
    var t = currentTrip();
    if (e.target.dataset.ck != null && t) { t.checklist[+e.target.dataset.ck].done = e.target.checked; markDirty(); render(); }
    if (e.target.id === "notes" && t) { t.notes = e.target.value; markDirty(); render(); }
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "q") { state.q = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (_) {} }
  });
  app.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target.dataset.form, t = currentTrip();
    if (!t) return;
    if (f === "ck") { var v = val("ck-new"); if (!v) return; (t.checklist = t.checklist || []).push({ t: v, done: false }); markDirty(); render(); document.getElementById("ck-new").focus(); }
    if (f === "trip") {
      var s = val("tf-start"), en = val("tf-end") || s;
      if (!s) return;
      t.start = s; t.end = en < s ? s : en;
      t.destinations = val("tf-dest").split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (!t.destinations.length) t.destinations = ["Destination TBD"];
      ["purpose", "parties", "car", "flight", "flightCost", "hotel", "hotelCost"].forEach(function (k) { t[k] = val("tf-" + k); });
      t.kind = val("tf-kind");
      if (t._new) { delete t._new; DATA.trips.push(t); draftTrip = null; }
      state.editTrip = false; markDirty(); render();
    }
    if (f === "res") {
      var title = val("rf-title"); if (!title) { document.getElementById("rf-title").focus(); return; }
      DATA.reservations.push({ trip_id: t.id, type: val("rf-type"), title: title, provider: val("rf-provider"), confirmation: val("rf-conf"), start: val("rf-start"), end: val("rf-end"), location: val("rf-location"), details: val("rf-details"), travelers: val("rf-travelers"), cost: val("rf-cost"), source: "Added by hand", email_link: "", status: "confirmed" });
      state.addRes = false; markDirty(); render();
    }
  });
  window.addEventListener("hashchange", function () { state.editTrip = !!(draftTrip && location.hash === "#trip-" + draftTrip.id); state.addRes = false; if (!state.editTrip) draftTrip = null; render(); window.scrollTo(0, 0); });

  function buildDocument() {
    var resetEl = document.head && document.head.querySelector("style");
    var reset = resetEl ? resetEl.textContent : ":root{color-scheme:light}body{margin:0}";
    var json = JSON.stringify(DATA, null, 1).replace(/</g, "\\u003c");
    var top = '<title>Goldman Travel Board</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">\n';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" +
      top + '<style id="app-css">' + document.getElementById("app-css").textContent + "</style>\n\n" +
      '<div id="app" class="wrap"><p class="muted">Loading trips…</p></div>\n\n' +
      '<script type="application/json" id="trip-data">' + json + "</scr" + "ipt>\n" +
      '<script id="app-js">' + document.getElementById("app-js").textContent + "</scr" + "ipt>\n</body></html>";
  }
  function save() {
    if (!artifactNs || state.saving) return;
    state.saving = true; render();
    var d = new Date(); DATA.updated = MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    artifactNs.publish(buildDocument()).then(function () { state.dirty = false; state.saving = false; state.msg = "Saved"; render(); }, function (err) {
      state.saving = false;
      var code = err && err.code;
      if (code === "conflict") state.msg = "Someone else just saved. Loading their version…";
      else if (code === "not_writer" || code === "not_granted") { state.canEdit = false; state.dirty = false; state.msg = "This view is read-only."; }
      else state.msg = "Couldn’t save (" + (code || "error") + "). Try again in a moment.";
      render();
    });
  }

  render();
  if (window.claude && typeof window.claude.use === "function") {
    Promise.all([window.claude.use("artifact"), window.claude.use("user")]).then(function (r) {
      artifactNs = r[0];
      if (!artifactNs || !r[1]) return;
      return r[1].canEdit().then(function (ok) { if (ok) { state.canEdit = true; render(); } });
    }).catch(function () {});
  }
})();
</script>
